<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="876" viewBox="0 0 1400 876" role="img" aria-labelledby="title desc">
  <title id="title">论文报告的触觉分类测试准确率</title>
  <desc id="desc">四类表面测试准确率百分之九十九，十六类表面百分之九十，四名受试者二十二类物体百分之九十一，随机失效百分之十九触觉传入通道时仍保持百分之八十。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#edf6f2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#123b32" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="876" rx="42" fill="url(#bg)"/>
  <text x="88" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#123b32">作者报告的测试结果：类别增加与损伤都会降低准确率</text>
  <text x="90" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#527168">数值来自论文正文与补充材料；不是重新训练或独立复现实验</text>
  <g filter="url(#shadow)"><rect x="86" y="205" width="1228" height="535" rx="30" fill="#fff"/></g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="220" y1="650" x2="1240" y2="650" stroke="#b9cec7" stroke-width="3"/>
    <line x1="220" y1="278" x2="220" y2="650" stroke="#b9cec7" stroke-width="3"/>
    <g fill="#6d877f" font-size="18" text-anchor="end">
      <text x="200" y="656">0</text><text x="200" y="568">25</text><text x="200" y="475">50</text><text x="200" y="382">75</text><text x="200" y="290">100%</text>
    </g>
    <g stroke="#e1ece8" stroke-width="2"><line x1="220" y1="557" x2="1240" y2="557"/><line x1="220" y1="464" x2="1240" y2="464"/><line x1="220" y1="371" x2="1240" y2="371"/><line x1="220" y1="278" x2="1240" y2="278"/></g>
    <g>
      <rect x="290" y="282" width="170" height="368" rx="18" fill="#0a7760"/>
      <text x="375" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#0a7760">99%</text>
      <text x="375" y="692" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">4 类表面</text>
      <text x="375" y="720" text-anchor="middle" font-size="18" fill="#527168">200 个样本</text>
    </g>
    <g>
      <rect x="535" y="315" width="170" height="335" rx="18" fill="#168aa0"/>
      <text x="620" y="295" text-anchor="middle" font-size="34" font-weight="800" fill="#168aa0">90%</text>
      <text x="620" y="692" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">16 类表面</text>
      <text x="620" y="720" text-anchor="middle" font-size="18" fill="#527168">800 个样本</text>
    </g>
    <g>
      <rect x="780" y="312" width="170" height="338" rx="18" fill="#e08b27"/>
      <text x="865" y="292" text-anchor="middle" font-size="34" font-weight="800" fill="#c87516">91%</text>
      <text x="865" y="692" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">22 类物体</text>
      <text x="865" y="720" text-anchor="middle" font-size="18" fill="#527168">4 人共 4400 个样本</text>
    </g>
    <g>
      <rect x="1025" y="352" width="170" height="298" rx="18" fill="#8757a5"/>
      <text x="1110" y="332" text-anchor="middle" font-size="34" font-weight="800" fill="#8757a5">80%</text>
      <text x="1110" y="692" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">随机通道失效</text>
      <text x="1110" y="720" text-anchor="middle" font-size="18" fill="#527168">19% 传入通道失效</text>
    </g>
  </g>
  <text x="700" y="808" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#607d74">训练与测试按样本 80/20 划分；不能视为跨设备、跨实验室或留一受试者泛化证明</text>
</svg>
