<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="876" viewBox="0 0 1400 876" role="img" aria-labelledby="title desc">
  <title id="title">抓取苹果时分类准确率随首脉冲到达而增长</title>
  <desc id="desc">首次触觉传入通道激活后零点三二秒达到百分之五十二准确率，零点三五秒达到百分之八十五，零点四三秒达到百分之百。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#eef7f3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#123b32" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="876" rx="42" fill="url(#bg)"/>
  <text x="88" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#123b32">为什么“第一批脉冲”有用：抓取还没结束，类别已经浮现</text>
  <text x="90" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#527168">苹果示例：准确率的上升紧跟首脉冲数量，而不是等到完整握持帧</text>
  <g filter="url(#shadow)"><rect x="84" y="206" width="1232" height="520" rx="30" fill="#fff"/></g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="170" y1="554" x2="1230" y2="554" stroke="#a9c3ba" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#d6e6e0" stroke-width="3"><line x1="170" y1="530" x2="170" y2="578"/><line x1="382" y1="530" x2="382" y2="578"/><line x1="594" y1="530" x2="594" y2="578"/><line x1="806" y1="530" x2="806" y2="578"/><line x1="1018" y1="530" x2="1018" y2="578"/><line x1="1230" y1="530" x2="1230" y2="578"/></g>
    <g fill="#607d74" font-size="19" text-anchor="middle"><text x="170" y="610">0</text><text x="382" y="610">0.1</text><text x="594" y="610">0.2</text><text x="806" y="610">0.3</text><text x="1018" y="610">0.4</text><text x="1230" y="610">0.5 s</text></g>
    <g>
      <circle cx="170" cy="554" r="22" fill="#0a7760"/>
      <path d="M170 530 V350" stroke="#0a7760" stroke-width="5"/>
      <rect x="105" y="272" width="250" height="78" rx="18" fill="#dff3ec"/>
      <text x="230" y="308" text-anchor="middle" font-size="24" font-weight="700" fill="#123b32">首个传入通道放电</text>
      <text x="230" y="336" text-anchor="middle" font-size="18" fill="#527168">定义为 t = 0</text>
    </g>
    <g>
      <circle cx="848" cy="554" r="24" fill="#168aa0"/>
      <path d="M848 530 V405" stroke="#168aa0" stroke-width="5"/>
      <rect x="735" y="314" width="226" height="92" rx="18" fill="#e1f4f7"/>
      <text x="848" y="352" text-anchor="middle" font-size="30" font-weight="800" fill="#168aa0">0.32 s · 52%</text>
      <text x="848" y="386" text-anchor="middle" font-size="18" fill="#527168">15 个通道已激活，占最终 57%</text>
    </g>
    <g>
      <circle cx="912" cy="554" r="24" fill="#e08b27"/>
      <path d="M912 578 V670" stroke="#e08b27" stroke-width="5"/>
      <rect x="760" y="670" width="304" height="84" rx="18" fill="#fff1d9"/>
      <text x="912" y="706" text-anchor="middle" font-size="30" font-weight="800" fill="#c87516">0.35 s · 85%</text>
      <text x="912" y="738" text-anchor="middle" font-size="18" fill="#6a4214">初始动态抓取阶段接近结束</text>
    </g>
    <g>
      <circle cx="1082" cy="554" r="24" fill="#8757a5"/>
      <path d="M1082 530 V320" stroke="#8757a5" stroke-width="5"/>
      <rect x="981" y="230" width="232" height="92" rx="18" fill="#f2eafb"/>
      <text x="1097" y="268" text-anchor="middle" font-size="30" font-weight="800" fill="#8757a5">0.43 s · 100%</text>
      <text x="1097" y="302" text-anchor="middle" font-size="18" fill="#513367">仍在保持阶段刚开始</text>
    </g>
    <path d="M210 510 C520 500 720 470 842 420 C930 382 1030 340 1120 270" fill="none" stroke="#0a7760" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 14"/>
    <text x="520" y="680" text-anchor="middle" font-size="20" fill="#607d74">时间从首次接触开始，而不是从手伸向物体开始</text>
  </g>
  <text x="700" y="818" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#607d74">来源：论文 Fig. 4A、4D 及正文；这是单个苹果类别的示例，不代表全部物体都在 0.43 s 达到 100%</text>
</svg>
