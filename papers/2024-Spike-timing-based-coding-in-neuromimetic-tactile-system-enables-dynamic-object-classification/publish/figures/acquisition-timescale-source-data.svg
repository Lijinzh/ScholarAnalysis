<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="876" viewBox="0 0 1400 876" role="img" aria-labelledby="title desc">
  <title id="title">触觉脉冲采集与模型时间尺度</title>
  <desc id="desc">论文补充方法报告共享十二点五兆赫时钟、六十四通道轮询零点五一二毫秒、单脉冲约一点二毫秒，以及十倍降采样后约五点一二毫秒的模型时间步。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#eef7f3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#123b32" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="876" rx="42" fill="url(#bg)"/>
  <text x="88" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#123b32">从硬件采样到 SNN 输入：四个不同时间尺度</text>
  <text x="90" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#527168">不能把“1.2 ms 脉冲宽度”直接当成最终网络的时间步</text>
  <g filter="url(#shadow)">
    <rect x="82" y="206" width="1236" height="530" rx="30" fill="#fff"/>
  </g>
  <line x1="170" y1="610" x2="1230" y2="610" stroke="#a9c3ba" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(190 0)">
      <circle cx="0" cy="610" r="18" fill="#0a7760"/>
      <rect x="-86" y="280" width="172" height="250" rx="24" fill="#dff3ec" stroke="#58aa91" stroke-width="3"/>
      <path d="M-48 448 h24 v-76 h48 v76 h24" fill="none" stroke="#0a7760" stroke-width="10" stroke-linejoin="round"/>
      <text x="0" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">共享时钟</text>
      <text x="0" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#0a7760">12.5 MHz</text>
      <text x="0" y="665" text-anchor="middle" font-size="20" fill="#527168">FPGA 同步 DAQ 与多路器</text>
    </g>
    <g transform="translate(515 0)">
      <circle cx="0" cy="610" r="18" fill="#168aa0"/>
      <rect x="-110" y="310" width="220" height="220" rx="24" fill="#e1f4f7" stroke="#5ca8b7" stroke-width="3"/>
      <g fill="#168aa0">
        <circle cx="-62" cy="372" r="10"/><circle cx="-20" cy="372" r="10"/><circle cx="22" cy="372" r="10"/><circle cx="64" cy="372" r="10"/>
        <circle cx="-62" cy="412" r="10"/><circle cx="-20" cy="412" r="10"/><circle cx="22" cy="412" r="10"/><circle cx="64" cy="412" r="10"/>
        <circle cx="-62" cy="452" r="10"/><circle cx="-20" cy="452" r="10"/><circle cx="22" cy="452" r="10"/><circle cx="64" cy="452" r="10"/>
      </g>
      <text x="0" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#123b32">64 通道轮询</text>
      <text x="0" y="505" text-anchor="middle" font-size="34" font-weight="800" fill="#168aa0">0.512 ms</text>
      <text x="0" y="665" text-anchor="middle" font-size="20" fill="#527168">每轮为每通道取 1 点</text>
    </g>
    <g transform="translate(835 0)">
      <circle cx="0" cy="610" r="18" fill="#e08b27"/>
      <rect x="-105" y="330" width="210" height="200" rx="24" fill="#fff1d9" stroke="#e5a557" stroke-width="3"/>
      <path d="M-70 455 h55 l12 -92 l13 92 h60" fill="none" stroke="#e08b27" stroke-width="10" stroke-linejoin="round"/>
      <text x="0" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#6a4214">单个硬件脉冲</text>
      <text x="0" y="505" text-anchor="middle" font-size="34" font-weight="800" fill="#c87516">约 1.2 ms</text>
      <text x="0" y="665" text-anchor="middle" font-size="20" fill="#527168">通常覆盖 2 至 3 个采样点</text>
    </g>
    <g transform="translate(1155 0)">
      <circle cx="0" cy="610" r="18" fill="#8757a5"/>
      <rect x="-105" y="300" width="210" height="230" rx="24" fill="#f2eafb" stroke="#ac88c3" stroke-width="3"/>
      <path d="M-70 420 h28 m18 0 h28 m18 0 h28 m18 0 h28" stroke="#8757a5" stroke-width="12" stroke-linecap="round"/>
      <path d="M-56 385 v70 m48 -70 v70 m48 -70 v70 m48 -70 v70" stroke="#c5add5" stroke-width="4" stroke-dasharray="8 8"/>
      <text x="0" y="348" text-anchor="middle" font-size="22" font-weight="700" fill="#513367">十倍降采样</text>
      <text x="0" y="505" text-anchor="middle" font-size="34" font-weight="800" fill="#8757a5">约 5.12 ms</text>
      <text x="0" y="665" text-anchor="middle" font-size="20" fill="#527168">送入软件 SNN 的时间步</text>
    </g>
  </g>
  <text x="700" y="806" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#607d74">来源：Supplementary Materials，Materials and Methods III 与 VIII</text>
</svg>
