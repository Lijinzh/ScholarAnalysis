<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">液态金属脉冲逻辑与人工瞳孔驱动链路</title>
  <desc id="desc">光电流先转换为控制电压，液态金属软开关通过周期性接触产生电流脉冲，后级放大器再将其转换为人工瞳孔执行器的驱动电压。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbf8"/>
      <stop offset="1" stop-color="#e8f4ef"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf3f5"/>
      <stop offset=".45" stop-color="#8aa3aa"/>
      <stop offset="1" stop-color="#294c55"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#16836c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173d35" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" rx="40" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#17352e">液态金属脉冲逻辑：把连续光强编码成接触脉冲</text>
  <text x="70" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#4b665f">光电流负责传递信息，后级电源与放大器负责提供执行器能量</text>

  <g font-family="Microsoft YaHei, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 170)">
      <rect width="220" height="170" rx="26" fill="#fff" stroke="#b7d5cc" stroke-width="3"/>
      <circle cx="66" cy="70" r="34" fill="#f3c04e"/>
      <g stroke="#f3c04e" stroke-width="6" stroke-linecap="round">
        <path d="M66 20V4M66 136v-16M16 70H0M132 70h-16M30 34L18 22M114 118l-12-12M102 34l12-12M30 106l-12 12"/>
      </g>
      <path d="M122 110c26-58 52-58 78 0" fill="none" stroke="#326ea4" stroke-width="6"/>
      <text x="110" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#24423a">NIFP 感光像素</text>
      <text x="110" y="166" text-anchor="middle" font-size="17" fill="#58706a">输出微弱光电流</text>
    </g>

    <g transform="translate(365 170)">
      <rect width="220" height="170" rx="26" fill="#fff" stroke="#b7d5cc" stroke-width="3"/>
      <path d="M55 46l92 44-92 44z" fill="#dff0ea" stroke="#16836c" stroke-width="4"/>
      <path d="M38 62h17M38 118h17M147 90h35" stroke="#24423a" stroke-width="4"/>
      <path d="M73 32c0-18 92-18 92 18v40" fill="none" stroke="#d08f31" stroke-width="4"/>
      <text x="110" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#24423a">第一级跨阻放大</text>
      <text x="110" y="166" text-anchor="middle" font-size="17" fill="#58706a">光电流 → 控制电压</text>
    </g>

    <g transform="translate(660 150)">
      <rect width="300" height="210" rx="28" fill="#fff" stroke="#59a993" stroke-width="4"/>
      <rect x="32" y="108" width="236" height="48" rx="18" fill="#d8efe9" stroke="#77b9a7" stroke-width="3"/>
      <rect x="46" y="96" width="54" height="14" rx="5" fill="#d29b4d"/>
      <circle cx="114" cy="108" r="44" fill="url(#metal)" stroke="#fff" stroke-width="5"/>
      <rect x="235" y="76" width="17" height="62" rx="7" fill="#71858a"/>
      <rect x="142" y="28" width="17" height="62" rx="7" fill="#71858a"/>
      <path d="M161 66h52" stroke="#e0734c" stroke-width="5" stroke-dasharray="9 8"/>
      <text x="150" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#24423a">EGaIn 脉冲软开关</text>
      <text x="150" y="203" text-anchor="middle" font-size="16" fill="#58706a">伸展接触 = 1；收缩断开 = 0</text>
    </g>

    <g transform="translate(1035 170)">
      <rect width="220" height="170" rx="26" fill="#fff" stroke="#b7d5cc" stroke-width="3"/>
      <path d="M55 46l92 44-92 44z" fill="#dff0ea" stroke="#16836c" stroke-width="4"/>
      <path d="M38 62h17M38 118h17M147 90h35" stroke="#24423a" stroke-width="4"/>
      <path d="M73 32c0-18 92-18 92 18v40" fill="none" stroke="#d08f31" stroke-width="4"/>
      <text x="110" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#24423a">第二级驱动放大</text>
      <text x="110" y="166" text-anchor="middle" font-size="17" fill="#58706a">脉冲电流 → 驱动电压</text>
    </g>
  </g>

  <g stroke="#16836c" stroke-width="6" fill="none" marker-end="url(#arrow)">
    <path d="M300 255h48"/>
    <path d="M595 255h48"/>
    <path d="M970 255h48"/>
    <path d="M1255 255h62v100"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#16836c">
    <text x="324" y="238" text-anchor="middle">Iphoto</text>
    <text x="619" y="238" text-anchor="middle">Vcontrol</text>
    <text x="994" y="238" text-anchor="middle">Ipulse</text>
  </g>

  <g transform="translate(980 390)" font-family="Microsoft YaHei, Arial, sans-serif" filter="url(#shadow)">
    <rect width="335" height="175" rx="28" fill="#173f36"/>
    <circle cx="168" cy="82" r="55" fill="#e8f5f1"/>
    <g fill="#385d64">
      <ellipse cx="168" cy="32" rx="16" ry="46"/>
      <ellipse cx="168" cy="132" rx="16" ry="46"/>
      <ellipse cx="118" cy="82" rx="46" ry="16"/>
      <ellipse cx="218" cy="82" rx="46" ry="16"/>
      <ellipse cx="133" cy="47" rx="15" ry="40" transform="rotate(-45 133 47)"/>
      <ellipse cx="203" cy="117" rx="15" ry="40" transform="rotate(-45 203 117)"/>
      <ellipse cx="203" cy="47" rx="15" ry="40" transform="rotate(45 203 47)"/>
      <ellipse cx="133" cy="117" rx="15" ry="40" transform="rotate(45 133 117)"/>
    </g>
    <circle cx="168" cy="82" r="25" fill="#fff"/>
    <text x="168" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">八瓣液态金属人工瞳孔</text>
  </g>

  <text x="70" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#17352e">软开关的四阶段循环</text>
  <g transform="translate(70 475)" font-family="Microsoft YaHei, Arial, sans-serif">
    <g>
      <rect width="190" height="205" rx="24" fill="#fff" stroke="#c7ddd7" stroke-width="3"/>
      <text x="95" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#24423a">① 开路 0</text>
      <rect x="24" y="112" width="142" height="38" rx="14" fill="#d9f0ea"/>
      <circle cx="72" cy="108" r="39" fill="url(#metal)"/>
      <rect x="145" y="74" width="12" height="66" rx="5" fill="#73868a"/>
      <text x="95" y="181" text-anchor="middle" font-size="16" fill="#58706a">液滴停在阳极侧</text>
    </g>
    <g transform="translate(235)">
      <rect width="190" height="205" rx="24" fill="#fff" stroke="#c7ddd7" stroke-width="3"/>
      <text x="95" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#24423a">② 向阴极伸展</text>
      <rect x="24" y="112" width="142" height="38" rx="14" fill="#d9f0ea"/>
      <path d="M42 115c34-43 72-43 111 0-42 22-76 22-111 0z" fill="url(#metal)"/>
      <rect x="145" y="74" width="12" height="66" rx="5" fill="#73868a"/>
      <path d="M75 86h55" stroke="#16836c" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="95" y="181" text-anchor="middle" font-size="16" fill="#58706a">电化学界面驱动</text>
    </g>
    <g transform="translate(470)">
      <rect width="190" height="205" rx="24" fill="#fff" stroke="#d89d69" stroke-width="3"/>
      <text x="95" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#24423a">③ 接触脉冲 1</text>
      <rect x="24" y="112" width="142" height="38" rx="14" fill="#d9f0ea"/>
      <path d="M42 115c36-43 76-43 113 0-43 22-78 22-113 0z" fill="url(#metal)"/>
      <rect x="145" y="74" width="12" height="66" rx="5" fill="#73868a"/>
      <path d="M68 70v24h18V58h18v36h18V48h18v46" fill="none" stroke="#df654b" stroke-width="4"/>
      <text x="95" y="181" text-anchor="middle" font-size="16" fill="#58706a">短接产生电流尖峰</text>
    </g>
    <g transform="translate(705)">
      <rect width="190" height="205" rx="24" fill="#fff" stroke="#c7ddd7" stroke-width="3"/>
      <text x="95" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#24423a">④ 回缩断开</text>
      <rect x="24" y="112" width="142" height="38" rx="14" fill="#d9f0ea"/>
      <ellipse cx="83" cy="109" rx="48" ry="31" fill="url(#metal)"/>
      <rect x="145" y="74" width="12" height="66" rx="5" fill="#73868a"/>
      <path d="M126 86H75" stroke="#16836c" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="95" y="181" text-anchor="middle" font-size="16" fill="#58706a">界面张力恢复</text>
    </g>
  </g>

  <path d="M260 578h28M495 578h28M730 578h28" stroke="#16836c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M941 690v62H145v-45" fill="none" stroke="#16836c" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="770" width="1245" height="78" rx="24" fill="#fff" stroke="#b7d5cc" stroke-width="3"/>
  <text x="95" y="805" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#17352e">频率与速度要分开：</text>
  <text x="286" y="805" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#3d5a52">更多有效脉冲/秒通常提高平均收缩速率；单次流速仍由电压、通道、液滴体积和界面反应决定。</text>
  <text x="95" y="832" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#637871">闭环中，瞳孔遮光后光电流下降，脉冲变稀，系统会自然减速并停在平衡孔径。</text>
</svg>
